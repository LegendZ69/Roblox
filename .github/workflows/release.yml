name: Publish versioned release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: driftwood-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checksum-pinned tools
        run: python scripts/bootstrap_tools.py
      - name: Verify game and built place
        run: python scripts/dev.py all
      - name: Verify release tooling
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Package exact source version
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: DriftwoodIsles-release
          path: build/release/
          if-no-files-found: error
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python scripts/publish_release.py --directory build/release --repository "$RELEASE_REPOSITORY" --commit "$RELEASE_COMMIT"
