name: Validate and build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checksum-pinned tools
        run: python scripts/bootstrap_tools.py
      - name: Validate game, place, and tooling with source-bound evidence
        run: python scripts/dev.py all
      - name: Package exact source version
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: DriftwoodIsles
          path: |
            build/DriftwoodIsles.rbxlx
            build/cloud-validation.json
            build/release/
          if-no-files-found: error
